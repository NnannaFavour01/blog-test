<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Preview Card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="blog.css" />
  </head>
  <body>
    <main class="card">
      <img src="savvy.webp" alt="Article illustration" class="card-img" />

      <div class="card-content">
        <span class="tag">Learning</span>
        <p class="publish-date">Published 19 Nov 2025</p>

        <h1 class="title">HTML & CSS foundations</h1>
        <p class="description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>

        <div class="author">
          <img src="image-now.webp" alt="Author avatar" class="avatar" />
          <p>Nnanna Favour Chidi</p>
        </div>
      </div>
    </main>
  </body>
</html>
